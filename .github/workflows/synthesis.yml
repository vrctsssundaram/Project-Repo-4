name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize safe_pwm3
        run: yosys -Q -T -p 'read_verilog -sv rtl/safe_pwm3.sv; hierarchy -check -top safe_pwm3; synth -top safe_pwm3; stat'
